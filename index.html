<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>חוט של תקווה</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: sticky brand bar + tab strip; each lesson is a projected slide (text beside a blended watercolor) with an optional facilitator panel. Single warm-paper look, light only by design. */
:root{
  --paper:#FAFAF7; --paper2:#F4EFE6; --card:#FFFFFF; --ink:#2B2422; --ink2:#5A514D;
  --bordeaux:#7D1C2A; --bordeaux-d:#651521; --olive:#5C6228; --gold:#C89B3C;
  --olive-t:#F1F2E8; --rose-t:#F6ECEA; --line:#E4DDD0;
  --display:'Frank Ruhl Libre',"David Libre",Georgia,serif;
  --body:Rubik,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:18px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--display);color:var(--bordeaux);margin:0;line-height:1.15;text-wrap:balance}
p{margin:0}
a{color:var(--bordeaux)}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:8px;max-width:1500px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none}
[hidden]{display:none!important}
.brand img{width:58px;height:46px;object-fit:contain}
.brand b{font-family:var(--display);font-size:24px;color:var(--bordeaux);white-space:nowrap}
.spacer{flex:1}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{font-size:17px;font-weight:500;min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--bordeaux);background:var(--card);color:var(--bordeaux);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--rose-t)}
.btn.solid{background:var(--bordeaux);color:#fff}
.btn.solid:hover{background:var(--bordeaux-d)}
.btn.quiet{border-color:#CFC8BA;color:var(--ink)}
.btn.on{background:var(--olive);border-color:var(--olive);color:#fff}
.btn.olive{border-color:var(--olive);color:var(--olive)}
.btn.big{font-size:21px;min-height:54px;padding:0 28px}
.btn:disabled{opacity:.4;cursor:default}
.tabs{overflow-x:auto;scrollbar-width:thin;border-top:1px solid var(--line);background:var(--paper)}
.tabs ul{list-style:none;margin:0 auto;padding:0;display:flex;gap:4px;max-width:1500px}
.tabs a{display:flex;align-items:center;gap:6px;padding:12px 14px;font-size:17px;font-weight:500;color:var(--ink2);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a img{width:22px;height:22px}
.tabs a[aria-current="page"]{color:var(--bordeaux);border-bottom-color:var(--bordeaux)}
.tabs a:hover{color:var(--bordeaux)}
main{max-width:1500px;margin:0 auto;padding-block:20px 48px}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:24px;align-items:center}
.hero .t{display:flex;flex-direction:column;gap:16px}
.hero .t img.logo{width:180px;height:auto}
.eyebrow{font-size:19px;font-weight:500;color:var(--olive);letter-spacing:.3px}
.hero h1{font-size:clamp(48px,6vw,88px);line-height:1}
.hero p{font-size:clamp(20px,1.8vw,26px);color:var(--ink2)}
.art{margin:0;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}
.art img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:28px}
.lcard{background:var(--card);border:1.5px solid var(--bordeaux);border-radius:20px;padding:16px 12px 18px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;text-decoration:none;color:var(--ink)}
.lcard:hover{background:var(--rose-t)}
.lcard img{width:96px;height:96px}
.lcard small{font-size:15px;font-weight:500;color:var(--olive)}
.lcard strong{font-family:var(--display);font-size:22px;color:var(--bordeaux);line-height:1.2}
.thread{margin-top:18px;text-align:center}
.thread img{width:100%;max-width:900px;height:auto}
.thread span{display:block;font-size:16px;color:var(--olive)}
.homeacts{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;justify-content:center}

/* counselor */
.cs{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:32px}
.cs h2{font-size:38px}
.badge{font-size:14px;color:var(--olive);border:1px solid var(--olive);border-radius:999px;padding:3px 10px;font-family:var(--body)}
.ck{display:flex;align-items:flex-start;gap:12px;font-size:18px;line-height:1.45;cursor:pointer;padding:6px 0}
.ck input{width:22px;height:22px;margin:3px 0 0;accent-color:var(--olive);flex:none}
.group{display:flex;flex-direction:column;gap:8px}
.group > span{font-weight:500}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:17px;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid #CFC8BA;background:var(--card);color:var(--ink);cursor:pointer}
.pill[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:#fff}
.contact{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:18px;padding:10px 14px}
.contact img{width:96px;height:96px}
.note{background:var(--olive-t);border-radius:16px;padding:14px 18px}

/* lesson */
.lesson{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.lesson.withguide{grid-template-columns:minmax(0,1fr) 340px}
.stage{background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.slide{position:relative;min-height:min(68vh,640px);display:flex;flex-direction:column}
.slide .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.slide > *:not(.bg){position:relative;z-index:1}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px;flex:1;align-items:center;padding:32px 40px}
.split.port{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.split .txt{display:flex;flex-direction:column;gap:16px;min-width:0}
.split .art img{max-height:min(60vh,580px)}
.pad{padding:32px 44px;display:flex;flex-direction:column;gap:18px;flex:1}
.sh{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sh h2{font-size:clamp(34px,3.6vw,56px)}
.sh .time{margin-inline-start:auto}
.time{font-size:18px;font-weight:500;color:var(--olive);border:1.5px solid var(--olive);border-radius:999px;padding:4px 14px;white-space:nowrap}
.lead{font-size:clamp(21px,2vw,30px);line-height:1.5}
.lead strong{color:var(--bordeaux)}
.kicker{font-size:clamp(18px,1.5vw,23px);font-weight:500;color:var(--olive)}
.q{font-size:clamp(20px,1.9vw,28px);line-height:1.4;background:var(--card);border-radius:18px;padding:14px 20px}
.q.olive{background:var(--olive-t)}
.q.rose{background:var(--rose-t);color:var(--bordeaux);font-weight:500}
.herogrid{display:flex;align-items:center;gap:40px;padding:40px 56px;flex:1;flex-wrap:wrap}
.herogrid .bead{width:clamp(140px,18vw,240px);height:auto;flex:none}
.herogrid .t{display:flex;flex-direction:column;gap:16px;flex:1;min-width:260px}
.herogrid h1{font-size:clamp(44px,5vw,74px)}
.msg{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:40px;flex:1}
.wash{position:relative;padding:16px 44px;display:inline-block}
.wash img{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.wash h2,.wash span,.wash a{position:relative;z-index:1}
.wash h2{color:#fff;font-size:clamp(34px,4vw,60px)}
.ocards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.ocard{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:12px 12px 18px;cursor:pointer;display:flex;flex-direction:column;gap:10px;text-align:center;color:var(--ink)}
.ocard:hover,.ocard[aria-pressed="true"]{border-color:var(--bordeaux)}
.ocard img{width:100%;aspect-ratio:16/10;object-fit:contain}
.ocard b{font-family:var(--display);font-size:clamp(24px,2.2vw,32px);color:var(--bordeaux)}
.ocard small{font-size:17px;color:var(--olive);font-weight:500}
.ocard .rec{align-self:center;font-size:15px;color:#fff;background:var(--olive);border-radius:999px;padding:3px 12px}
.agrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.agree{font-size:clamp(20px,1.8vw,26px);min-height:80px;border-radius:20px;border:1.5px dashed #CFC8BA;background:var(--card);color:var(--ink);cursor:pointer;padding:12px 18px;display:flex;align-items:center;gap:14px;text-align:right}
.agree[aria-pressed="true"]{border-style:solid;border-color:var(--olive);background:var(--olive-t)}
.agree .mk{width:30px;height:30px;border-radius:50%;border:2px solid #CFC8BA;flex:none}
.agree[aria-pressed="true"] .mk{border-color:var(--olive);background:var(--olive)}
.field{font-size:21px;min-height:54px;border-radius:16px;border:1.5px solid #CFC8BA;padding:0 16px;background:var(--card);color:var(--ink);width:100%;font-family:inherit}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.scale{display:flex;flex-direction:column;gap:10px}
.srow{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:20px;align-items:center;background:var(--card);border-radius:16px;padding:10px 20px}
.srow span{font-size:clamp(19px,1.7vw,24px);line-height:1.3}
.srow input{width:100%;accent-color:var(--bordeaux);height:32px}
.ends{display:flex;justify-content:space-between;font-size:18px;color:var(--olive);padding-inline-start:340px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{font-size:clamp(18px,1.6vw,23px);background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:8px 18px}
.chip.btnchip{cursor:pointer;color:var(--ink)}
.chip.btnchip[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:#fff}
.bigcard{background:var(--card);border:1.5px solid var(--line);border-radius:24px;padding:26px 34px;font-family:var(--display);font-weight:700;font-size:clamp(28px,3vw,40px);color:var(--bordeaux);text-align:center;line-height:1.3;max-width:820px;margin:0 auto;width:100%}
.knot{display:flex;align-items:center;gap:48px;padding:36px 56px;flex:1;flex-wrap:wrap}
.knot .orb{position:relative;width:min(300px,60vw);aspect-ratio:1;display:flex;align-items:center;justify-content:center;flex:none}
.knot .orb .sp{position:absolute;inset:0;width:100%;height:100%}
.knot .orb .b{position:relative;width:70%}
.knot h2{font-size:clamp(52px,6vw,84px)}
.letter{display:flex;flex-direction:column;flex:1}
.letter .hd{position:relative;display:flex;align-items:center;justify-content:center;height:190px}
.letter .hd img{max-height:100%;max-width:100%}
.letter .hd h2{position:absolute;font-size:clamp(36px,3.6vw,50px)}
.letter .bd{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 40px;padding:10px 48px 28px;font-size:clamp(19px,1.7vw,24px);line-height:1.45}
.letter .bd strong{color:var(--bordeaux)}
.letter .full{grid-column:1/-1;color:var(--olive)}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.col{background:var(--card);border-radius:20px;padding:20px 24px;display:flex;flex-direction:column;gap:10px;font-size:clamp(20px,1.8vw,25px)}
.col.rose{background:var(--rose-t)}
.col b{font-family:var(--display);font-size:clamp(26px,2.4vw,32px);color:var(--olive)}
.col.rose b{color:var(--bordeaux)}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.fc{position:relative;min-height:280px;border-radius:22px;border:1.5px solid var(--bordeaux);overflow:hidden;cursor:pointer;padding:0;background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center}
.fc .back{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fc .in{position:relative;margin:0 18px;background:rgba(255,255,255,.95);border-radius:16px;padding:16px;font-size:clamp(20px,1.8vw,26px);font-weight:500}
.fc .open{position:absolute;inset:0;background:var(--olive-t);display:flex;flex-direction:column;justify-content:center;gap:14px;padding:18px;text-align:center}
.fc .open span:first-child{font-size:clamp(20px,1.8vw,26px);font-weight:500}
.fc .open span:last-child{font-size:clamp(18px,1.6vw,22px);color:var(--olive)}
.bubble{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:300px}
.bubble img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.bubble p{position:relative;max-width:520px;text-align:center;font-family:var(--display);font-weight:700;font-size:clamp(24px,2.4vw,34px);line-height:1.3;color:var(--bordeaux);white-space:pre-line;padding:0 40px}
.plgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.plank{background:var(--card);border:1.5px solid var(--gold);border-radius:16px;padding:12px 16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:right;color:var(--ink);min-height:100px}
.plank[aria-pressed="true"]{background:#FBF4E4}
.plank strong{font-size:clamp(20px,1.8vw,25px);color:var(--bordeaux)}
.plank span{font-size:clamp(18px,1.6vw,23px)}
.vgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.beadv{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink)}
.beadv img{width:90px;height:90px}
.beadv b{font-family:var(--display);font-size:24px;color:var(--bordeaux)}
.beadv span{font-size:28px;font-weight:700;color:var(--olive);font-variant-numeric:tabular-nums}
.rgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.rc{position:relative;min-height:120px;border-radius:16px;border:1.5px solid var(--line);overflow:hidden;cursor:pointer;padding:0;background:var(--card);color:var(--ink)}
.rc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rc div{position:absolute;inset:0;background:#FBF4E4;display:flex;align-items:center;justify-content:center;padding:10px 16px;font-size:clamp(17px,1.5vw,21px);line-height:1.35;font-weight:500;text-align:center}
.strip{height:44px;overflow:hidden;border-top:1px solid var(--line)}
.strip img{width:100%;height:44px;object-fit:cover}
.nav{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-top:1px solid var(--line)}
.dots{flex:1;display:flex;justify-content:center;align-items:center;flex-wrap:wrap}
.dot{width:28px;height:44px;border:none;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.dot i{display:block;width:13px;height:13px;border-radius:50%;background:#D8D2C6}
.dot[aria-current="step"] i{background:var(--bordeaux);transform:scale(1.25)}
.count{font-size:16px;color:var(--ink2);margin-inline-start:10px;font-variant-numeric:tabular-nums}
.guide{background:var(--olive-t);border:1px solid #DCDDCB;border-radius:20px;padding:18px 20px;font-size:16px;line-height:1.6;align-self:start;position:sticky;top:150px;max-height:calc(100vh - 170px);overflow:auto}
.guide .lbl{font-size:13px;font-weight:700;color:var(--olive);letter-spacing:.5px;margin-bottom:8px}
.guide p{margin:0 0 10px}
.guide h4{margin:12px 0 4px;font-size:16px;color:var(--bordeaux)}
.guide .box{background:var(--card);border-radius:10px;padding:8px 10px;margin-bottom:10px}

/* strengths */
.kh{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.kh img{height:120px;width:auto}
.kh h1{font-size:clamp(40px,4vw,54px);color:#7A3E80}
.kh span{font-size:22px;color:#C2405F;font-weight:500}
.jumps{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.jumps a{font-size:17px;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--c);color:var(--c);display:inline-flex;align-items:center;text-decoration:none;background:var(--card)}
.sec{border:3px solid var(--c);border-radius:28px;background:var(--card);overflow:hidden;margin-top:28px;padding-bottom:22px}
.sec .cl{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 22px;background:var(--t);border-bottom:3px solid var(--c);margin-bottom:16px}
.sec .cl img{width:42px;height:42px}
.sec .cl h2{font-size:clamp(28px,2.8vw,36px);color:var(--c)}
.tag{font-size:16px;color:var(--c);border:1.5px solid var(--c);border-radius:999px;padding:4px 14px;background:var(--card);font-weight:500}
.sec .sub{margin:0 22px 14px;font-style:italic;font-size:19px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:18px;padding:0 22px}
.lc{position:relative;background:var(--card);border:2px solid var(--c);border-top-width:10px;border-radius:22px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;font-size:19px;line-height:1.55}
.lc h3{font-size:26px;color:var(--c);padding-left:70px}
.lc .st{position:absolute;top:14px;left:14px;font-size:13px;color:var(--c);background:var(--t);border-radius:999px;padding:3px 10px}
.lc .take{background:var(--t);border-radius:12px;padding:10px 14px;font-size:18px}
.lc .btn{border-color:var(--c);color:var(--c);align-self:flex-start}

/* print tab */
.doc{max-width:820px;margin:0 auto;background:var(--card);border-radius:18px;padding:48px 56px;font-size:17px;line-height:1.65}
.doc h2{font-size:28px;margin:34px 0 8px}
.doc h3{font-size:21px;margin:22px 0 6px}
.doc p{margin:6px 0}
.doc .gl{background:var(--olive-t);border-radius:10px;padding:10px 14px;margin:8px 0;font-size:15px}
.doc .box{border:1px solid #CFC8BA;border-radius:10px;padding:12px 16px;margin:12px 0}
.doc .cb{display:inline-block;width:14px;height:14px;border:1.5px solid var(--olive);border-radius:3px;margin-inline-end:8px;vertical-align:-2px}
.doc .row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.doc .row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.printbar{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:18px}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(43,36,34,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--card);border-radius:24px;padding:28px 34px;display:flex;flex-direction:column;gap:14px}
.dlg h2{font-size:34px}
.dlg ol{margin:0;padding-inline-start:26px;font-size:21px;line-height:1.6}

@media (prefers-reduced-motion:no-preference){.fade{animation:fd .35s ease}.pop{animation:pp .6s ease}}
@keyframes fd{from{opacity:0}to{opacity:1}}
@keyframes pp{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}

@media (max-width:1100px){.lesson.withguide{grid-template-columns:minmax(0,1fr)}.guide{position:static;max-height:none}}
@media (max-width:900px){
  .hero,.cs{grid-template-columns:minmax(0,1fr)}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .split,.split.port{grid-template-columns:minmax(0,1fr);padding:22px 20px}
  .split .art img{max-height:46vh}
  .pad{padding:22px 20px}
  .herogrid,.knot{padding:24px 20px;gap:20px}
  .ocards,.fgrid,.rgrid{grid-template-columns:minmax(0,1fr)}
  .agrid,.cols2,.plgrid,.letter .bd{grid-template-columns:minmax(0,1fr)}
  .vgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .srow{grid-template-columns:minmax(0,1fr)}
  .ends{padding-inline-start:0}
  .letter .bd{padding:10px 20px 22px}
  .doc{padding:28px 20px}
  .doc .row3,.doc .row2{grid-template-columns:minmax(0,1fr)}
  .acts .btn{font-size:15px;padding:0 12px}
}
@media print{
  .top,.printbar,.modal{display:none!important}
  html,body{background:#fff}
  main{padding:0}
  .doc{border-radius:0;padding:0;max-width:none}
}
</style>
</head>
<body>

<header class="top">
  <div class="bar gut">
    <a class="brand" href="#home" aria-label="חוט של תקווה, לדף הבית">
      <img src="images/logo-nophone.webp" alt="">
      <b>חוט של תקווה</b>
    </a>
    <div class="spacer"></div>
    <div class="acts">
      <button class="btn quiet" id="tgBasic" type="button" aria-pressed="false" hidden>התאמה ליסודי</button>
      <button class="btn quiet" id="tgGuide" type="button" aria-pressed="true">מסך מנחה</button>
      <button class="btn solid" id="openWhat" type="button">מה עושים עכשיו</button>
    </div>
  </div>
  <nav class="tabs gut" aria-label="לשוניות">
    <ul id="tabs"></ul>
  </nav>
</header>

<main class="gut" id="main"></main>
<div id="modal"></div>

<script>
(function(){
const IMG = n => 'images/' + n;
const store = {
  get(){ try { return JSON.parse(localStorage.getItem('chut-tikva') || '{}'); } catch(e){ return {}; } },
  set(v){ try { localStorage.setItem('chut-tikva', JSON.stringify(v)); } catch(e){} }
};
const saved = store.get();
const S = Object.assign({
  sector:'general', classType:'mixed', guide:true, basic:false, mode:'prevention',
  checks:[false,false,false,false,false,false,false], done:[false,false,false,false,false]
}, saved);
S.tab = 'home'; S.modal = null;
const L = {1:{},2:{},3:{},4:{},5:{}};
for (const k in L) L[k] = { k:0 };
function persist(){ store.set({sector:S.sector,classType:S.classType,guide:S.guide,basic:S.basic,mode:S.mode,checks:S.checks,done:S.done}); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pick = (f,m,x) => S.classType==='girls' ? f : (S.classType==='boys' ? m : x);
const dig = () => S.sector !== 'haredi';

const TABS = [
  ['home','בית',null],['counselor','ליועץ/ת',null],
  ['lesson1','מפגש 1','bead-1.webp'],['lesson2','מפגש 2','bead-2.webp'],['lesson3','מפגש 3','bead-3.webp'],['lesson4','מפגש 4','bead-4.webp'],['lesson5','מפגש 5','bead-5.webp'],
  ['strengths','הכוחות שבדרך',null],['print','הדפסה',null]
];
const BEADS = ['bead-1.webp','bead-2.webp','bead-3.webp','bead-4.webp','bead-5.webp'];
const DIVIDERS = ['thread-divider-1.webp','thread-divider-2.webp','thread-divider-3.webp','thread-divider-4.webp','thread-divider-5.webp'];
const LTITLES = ['החוט הראשון: מה עושה לי טוב','הרשת שמחזיקה אותי','הכוחות שכבר יש בי','הפצע והדרך לרפא','חבר בשביל חבר'];
const LWORDS = ['הטוב','הקשר','הכוח','הריפוי','העזרה'];
const BEADCOL = ['צהוב חרדל','בורדו','ירוק זית','ורוד עתיק','זהב'];

/* ---------- shared slide parts ---------- */
const img = (n, alt) => `<img src="${IMG(n)}" alt="${esc(alt||'')}"${alt?'':' aria-hidden="true"'}>`;
const art = (n, alt) => `<figure class="art">${img(n, alt)}</figure>`;
const head = (t, time) => `<div class="sh"><h2>${t}</h2>${time?`<span class="time">${time}</span>`:''}</div>`;
const split = (txt, n, alt, port) => `<div class="split${port?' port':''}"><div class="txt">${txt}</div>${art(n, alt)}</div>`;
const gate = (bg, bead, beadAlt, kicker, title, lead) => `<img class="bg" src="${IMG(bg)}" alt=""><div class="herogrid"><img class="bead" src="${IMG(bead)}" alt="${beadAlt}"><div class="t"><span class="kicker">${kicker}</span><h1>${title}</h1><p class="lead">${lead}</p></div></div>`;
const agreeRecap = () => `<div class="pad">${head('ההסכמות שלנו')}<div class="agrid"><div class="q">מקשיבים זה לזה</div><div class="q">מכבדים כל אחד ואחת</div><div class="q">מה שנאמר כאן, נשאר כאן</div><div class="q">מדברים על עצמנו</div></div><p class="lead" style="color:var(--olive)">ועוד מה שהוספנו יחד במפגש הראשון.</p></div>`;
const week = (n, word, lead) => `<div class="herogrid"><img class="bead" src="${IMG(BEADS[n-2])}" alt="החרוז מהמפגש הקודם"><div class="t"><span class="kicker">הקשר מהשבוע</span><h2 style="font-size:clamp(38px,4vw,58px)">איפה פגשתי השבוע את "${word}"?</h2><p class="lead">${lead}</p></div></div>`;
const message = (bg, wash, big, small, kicker) => `<img class="bg" src="${IMG(bg)}" alt=""><div class="msg"><span class="kicker">${kicker||'מסר מרכזי'}</span><div class="wash"><img src="${IMG(wash)}" alt=""><h2>${big}</h2></div><p class="lead" style="max-width:920px">${small}</p></div>`;
const knot = (n, st, extra) => {
  const tied = st.tied;
  return `<div class="knot"><div class="orb">${tied?`<img class="sp pop" src="${IMG('ui-sparkle.webp')}" alt="">`:''}<img class="b" src="${IMG(BEADS[n-1])}" alt="חרוז ${BEADCOL[n-1]}"></div><div class="t" style="display:flex;flex-direction:column;gap:16px;flex:1;min-width:260px"><span class="kicker">קושרים קשר ${['ראשון','שני','שלישי','רביעי','חמישי'][n-1]}</span><h2>${LWORDS[n-1]}</h2><p class="lead">${pick('כל אחת קושרת','כל אחד קושר','כל אחד/ת קושר/ת')} <strong>חרוז ${BEADCOL[n-1]}</strong> לחוט.</p>${extra||''}${tied?`<p class="lead fade" style="color:var(--olive);font-weight:500">${['החרוז הראשון על החוט.','שני חרוזים על החוט.','שלושה חרוזים על החוט.','ארבעה חרוזים על החוט.','חמישה חרוזים. החוט שלם.'][n-1]}</p>`:`<button class="btn solid big" style="align-self:flex-start" data-act="tie">קושרים את החרוז</button>`}</div></div>`;
};
const letter = (did, q, extra) => `<div class="letter"><div class="hd"><img src="${IMG('parents-header.webp')}" alt=""><h2>מכתב להורים</h2></div><div class="bd">${did}<div><strong>שאלה לשיחה בבית:</strong> ${q}</div>${extra||''}<div class="full">נשמח לעמוד לרשותכם בכל שאלה: [שם היועץ/ת] · [דרך ליצירת קשר]</div></div></div>`;
const endSlide = (next, n, strengths, imgName, alt) => `${split(`<h2 style="font-size:clamp(38px,4vw,58px)">${n===5?'החוט ממשיך איתנו':'שומרים עד הפעם הבאה'}</h2><p class="lead">${n===5?'חמישה חרוזים: הטוב, הקשר, הכוח, הריפוי והעזרה.':'את החוטים שומרים במעטפה עם השם, עד המפגש הבא.'}</p>${next?`<p class="lead" style="color:var(--olive)">${next}</p>`:''}<div class="row">${n<5?`<a class="btn solid big" href="#lesson${n+1}">למפגש ${n+1}</a>`:''}<a class="btn big" href="#home">לדף הבית</a>${strengths?`<a class="btn olive big" href="#strengths">להמשך הדרך: הכוחות שבדרך</a>`:''}</div>`, imgName||'envelopes.webp', alt||'מעטפות עם חוטים וחרוזים בתוך קופסת עץ', true)}`;
const reveal = (shown, txt, btn, act, cls) => shown ? `<div class="q ${cls||'olive'} fade">${txt}</div>` : `<button class="btn olive" style="align-self:flex-start" data-act="${act}">${btn}</button>`;
const basicNote = t => S.basic ? `<h4>התאמה ליסודי (כיתה ו')</h4><p>${t}</p>` : '';

/* ---------- lessons ---------- */
const LESSONS = {};

LESSONS[1] = {
  ids:['gate','choose','opener','agree','flags','scale','msg','knot','letter','end'],
  titles:['פתיחה','בחירת פתיח','הפתיח','ההסכמות שלנו','דגלוני השמחה','ציר השמחה','מסר מרכזי','קושרים קשר','מכתב להורים','סיום'],
  init:{opener:'a',q:false,flagN:1,agree:[false,false,false,false],extra:'',scale:[50,50,50,50],scaleMsg:false,tied:false},
  slide(id, st){
    switch(id){
      case 'gate': return gate('bg-3.jpg','bead-1.webp','חרוז צהוב חרדל עם שמש זהובה','מפגש 1 · הטוב','החוט הראשון:<br>מה עושה לי טוב','היום נגלה יחד מה עושה לנו טוב, ונבנה כיתה שנעים להיות בה.');
      case 'choose': {
        const c = (o, n, alt, k, t, rec) => `<button class="ocard" data-act="opener" data-arg="${o}" aria-pressed="${st.opener===o}">${img(n,alt)}<small>${k}</small><b>${t}</b>${rec?`<span class="rec">מומלץ לכיתה ו'</span>`:''}</button>`;
        return `<div class="pad">${head('איך נפתח היום?','5 דק\'')}<div class="ocards">${c('a','l1-yarn-web.webp','ידיים במעגל מחזיקות רשת חוטי זהב',"פתיח א'",'פקעת החוטים')}${c('b','l1-treasure-box.webp','תיבת עץ פתוחה ובה חפצים קטנים',"פתיח ב'",'קופסת האוצרות',S.basic)}${c('c','l1-good-moment.webp','ידיים מצלמות שקיעה בטלפון',"פתיח ג'",dig()?'מצלמת הרגע הטוב':'ציור הרגע הטוב')}</div></div>`;
      }
      case 'opener':
        if (st.opener==='a') return split(`${head('פקעת החוטים','5 דק\'')}<ol class="lead" style="margin:0;padding-inline-start:28px"><li>${pick('יושבות או עומדות במעגל','יושבים או עומדים במעגל','יושבים או עומדים במעגל')}.</li><li>${pick('הראשונה מחזיקה','הראשון מחזיק','הראשון/ה מחזיק/ה')} את קצה החוט ומשלים: <strong>"אני ${pick('מרגישה מחוברת','מרגיש מחובר','מרגיש/ה מחובר/ת')} היום ל... כי..."</strong></li><li>זורקים את הפקעת הלאה, וממשיכים להחזיק בחוט.</li><li>ממשיכים עד ש${pick('כולן','כולם','כולם')} מחזיקים.</li></ol>${reveal(st.q,'מה קורה לרשת כשמישהו עוזב את החוט?<br>ומה קורה כשכולם מושכים קצת?','שאלה על הרשת','q')}`,'l1-yarn-web.webp','ידיים במעגל מחזיקות רשת חוטי זהב');
        if (st.opener==='b') return split(`${head('קופסת האוצרות','5 דק\'')}<p class="lead">בקופסה יש חפצים קטנים: זרע, פלסטר, מפתח, מצפן, פקעת חוט ונר.</p><p class="lead"><strong>${pick('כל אחת בוחרת','כל אחד בוחר','כל אחד/ת בוחר/ת')} חפץ אחד</strong> שמזכיר לי משהו שעוזר לי.</p><div class="q">מה החפץ שבחרתי מספר עליי?</div>`,'l1-treasure-box.webp','תיבת עץ פתוחה ובה חפצים קטנים');
        return split(`${head(dig()?'מצלמת הרגע הטוב':'ציור הרגע הטוב','5 דק\'')}<p class="lead">${dig()?'מעלים לפאדלט תמונה או ציור של':'מציירים על פתק'} <strong>רגע קטן וטוב מהשבוע.</strong></p><p class="lead">בלי פנים. רק הרגע עצמו.</p><p class="lead" style="color:var(--olive)">ביחד נבנה גלריה כיתתית של רגעים טובים.</p>`,'l1-good-moment.webp','ידיים מצלמות שקיעה בטלפון',true);
      case 'agree': {
        const t = ['מקשיבים זה לזה','מכבדים כל אחד ואחת','מה שנאמר כאן, נשאר כאן','מדברים על עצמנו'];
        return `<div class="pad">${head('ההסכמות שלנו','5 דק\'')}<p class="lead">מה יעזור לכולנו להרגיש בנוח ובביטחון כאן?</p><div class="agrid">${t.map((x,i)=>`<button class="agree" data-act="agree" data-arg="${i}" aria-pressed="${st.agree[i]}"><span class="mk"></span><span>${x}</span></button>`).join('')}</div><label style="display:flex;flex-direction:column;gap:6px;font-size:19px;color:var(--olive)">ועוד הסכמה, במילים שלנו:<input class="field" id="l1extra" type="text" data-input="extra" value="${esc(st.extra)}" placeholder="כותבים כאן יחד"></label></div>`;
      }
      case 'flags': {
        const qs = ['איזה צבע יש לשמחה שלך?','עם מי היית ברגע הזה?','מה שומר על השמחה הזאת?'];
        const max = S.basic ? 1 : 3, n = Math.min(st.flagN, max);
        return split(`${head('דגלוני השמחה','15 דק\'')}<p class="lead"><strong>3 דברים קטנים שעושים לי טוב,</strong> ועוד דבר אחד.</p><p class="lead">${dig()?'דגלון אחד לכל דבר. אפשר גם פוסט בלי שם ב"קיר השמחה" בפאדלט.':'דגלון נייר אחד לכל דבר, בלי שם, ותולים יחד על לוח הכיתה.'}</p>${S.sector!=='general'?'<p class="lead" style="color:var(--olive)">אפשר לחשוב גם על רגעים של שבת, תפילה, משפחה ואמונה, שנותנים שמחה וכוח.</p>':''}${qs.slice(0,n).map(x=>`<div class="q fade">${x}</div>`).join('')}${n<max?'<button class="btn olive" style="align-self:flex-start" data-act="flagN">שאלה הבאה</button>':''}`,'l1-joy-flags.webp','שרשרת דגלונים צבעוניים ליד חלון מואר');
      }
      case 'scale': {
        const fr = pick('חברה שלחה','חבר שלח','חבר/ה שלח/ה');
        const t = [fr+' לי הודעה מצחיקה','ירד גשם בדיוק בהפסקה','יוצאים לפעילות כיתתית מחוץ לכיתה','ארוחת ערב משפחתית ביחד'];
        const face = (c, smile) => `<svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="none" stroke="${c}" stroke-width="2"></circle><circle cx="12" cy="14" r="1.8" fill="${c}"></circle><circle cx="22" cy="14" r="1.8" fill="${c}"></circle>${smile?`<path d="M10.5 20.5c3.5 4.5 9.5 4.5 13 0" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"></path>`:`<path d="M11 23h12" stroke="${c}" stroke-width="2" stroke-linecap="round"></path>`}</svg>`;
        return `<div class="pad">${head('ציר השמחה','8 דק\'')}<p class="lead">כמה זה משמח אותי?</p><div class="ends"><span>${S.basic?face('#5C6228',false):''} קצת</span><span>מאוד ${S.basic?face('#7D1C2A',true):''}</span></div><div class="scale">${t.map((x,i)=>`<div class="srow"><span>${x}</span><input type="range" id="l1s${i}" min="0" max="100" value="${st.scale[i]}" data-range="${i}" aria-label="${esc(x)}"></div>`).join('')}</div>${reveal(st.scaleMsg,'אותו אירוע, חוויה אחרת '+pick('לכל אחת','לכל אחד','לכל אחד/ת')+'. לאיך שאנחנו מסתכלים יש השפעה.','מה גילינו?','scaleMsg','rose')}</div>`;
      }
      case 'msg': return message('bg-3.jpg','ui-wash-1.webp','יש מקום גם לשמחה וגם לעצב.','כש'+pick('אני שמה לב','אני שם לב','אני שם/ה לב')+' לרגעים הטובים הקטנים, הם נותנים לי כוח.');
      case 'knot': return knot(1, st, '<p class="lead">מה לקחתי היום? מילה אחת, רק לעצמי.</p>');
      case 'letter': return letter(`<div><strong>חוט של תקווה.</strong> השבוע פתחנו יחידה בת חמישה מפגשים על שמחה, שייכות, כוחות אישיים ופנייה לעזרה. בכל מפגש ${pick('כל אחת קושרת','כל אחד קושר','כל אחד/ת קושר/ת')} חרוז לחוט אישי.</div><div><strong>מה עשינו היום:</strong> גילינו מה עושה לנו טוב, ניסחנו יחד את ההסכמות של הכיתה, וראינו שיש מקום גם לשמחה וגם לעצב.</div><div><strong>הקשר שנקשר:</strong> "הטוב", חרוז צהוב חרדל.</div>`,'מה היה הרגע הכי טוב שלך השבוע?');
      case 'end': return endSlide('במפגש הבא: הרשת שמחזיקה אותי.',1);
    }
  },
  guide(id, st){
    const g = {
      gate:'<p><strong>מקור:</strong> המערך של חני, שיעור 1 חלק א\'.</p><p><strong>מטרות:</strong> מקום לרגעים טובים ביומיום; שמחה ועצב על רצף; מרחב בטוח ולכידות.</p><h4>מהלך (45 דק\')</h4><p>פתיח 5\' · ההסכמות שלנו 5\' · דגלוני השמחה 15\' · ציר השמחה 8\' · שיחה וקושרים קשר 5\' · מכתב להורים.</p>',
      choose:'<p>תפריט לבחירת היועץ/ת. <strong>פתיח א\' מומלץ:</strong> ממנו נולד החוט האישי.</p><p>אם נבחר פתיח אחר, החוטים מחולקים חתוכים בסוף המפגש.</p>',
      agree:'<p>הכיתה מנסחת 3-4 הסכמות. המנחה מוודא/ת שיש: הקשבה, כבוד, מה שנאמר כאן נשאר כאן, מדברים על עצמנו.</p><p>ההסכמות מוצגות בקצרה בתחילת כל מפגש בהמשך.</p>',
      flags:'<p>דגלון פיזי או פוסט אנונימי ב"קיר השמחה" בפאדלט (פיקוח מופעל).</p><p><strong>שאלות:</strong> איזה צבע יש לשמחה שלך? עם מי היית? מה שומר עליה?</p>',

  <h2>לפני שמתחילים · ליועץ/ת</h2>

  <div class="box"><div><span class="cb"></span>ההחלטה להפעיל את היחידה התקבלה בצל"ח, לאחר היוועצות עם פסיכולוג/ית השפ"ח ו/או מדריך/ת היחידה בשפ"י.</div><div><span class="cb"></span>מופו מעגלי החשיפה והפגיעות. תלמידים במעגל הקרוב קיבלו קודם מענה פרטני, ונבחן עם הצוות אם ואיך ישתתפו.</div><div><span class="cb"></span>הנחיה משותפת: יועץ/ת ומחנך/ת הכיתה.</div><div><span class="cb"></span>נקבע "מקום בטוח לצאת אליו" ואיש צוות זמין בזמן השיעור.</div><div><span class="cb"></span>ההורים יודעו מראש.</div><div><span class="cb"></span>נבחר פתיח לשיעור הראשון.</div><div><span class="cb"></span>הוכנו חומרי החוט: חוט כותנה בעובי בינוני (זהב או חרדל), חוט זהב, חרוזי פוני 6x9 מ"מ בחמשת הצבעים (כ-35 מכל צבע), מעטפות, תגיות קרטון, מספריים.</div></div>
  <div class="gl"><strong>הנחיה בטיחותית:</strong> התוצר הוא צמיד או מחזיק מפתחות בלבד. לא מכינים שרשרת או שום דבר שנענד על הצוואר, ולא תולים חוטים ארוכים בכיתה. אורך החוט האישי עד כ-60 ס"מ. אין צורך להסביר זאת לתלמידים.</div>

  <h2>מפגש 1 · החוט הראשון: מה עושה לי טוב</h2>
  <p><strong>הקשר:</strong> הטוב · <strong>החרוז:</strong> צהוב חרדל · <strong>מטרות:</strong> מקום לרגעים טובים ביומיום; שמחה ועצב על רצף; מרחב בטוח ולכידות.</p>
  <h3>פתיח (5') · לבחירת היועץ/ת</h3>
  <p><strong>א. פקעת החוטים (מומלץ):</strong> מעגל. הראשון/ה מחזיק/ה את קצה החוט ומשלים/ה "אני מרגיש/ה מחובר/ת היום ל... כי...", זורק/ת את הפקעת הלאה ומחזיק/ה בחוט, עד שכולם מחזיקים. שואלים: "מה קורה לרשת כשמישהו עוזב את החוט? ומה קורה כשכולם מושכים קצת?" בסוף גוזרים את הרשת, וכל תלמיד/ה נשאר/ת עם חוט של כ-60 ס"מ. המסר: "החוט האישי שלך נולד מהרשת של כולנו".</p>
  <div class="gl">מי שמתקשה יכול/ה לומר "אני מרגיש/ה מחובר/ת לכיתה הזו". גרסה דיגיטלית: מנטימטר שנבנה לרשת. אם נבחר פתיח אחר, החוטים מחולקים חתוכים בסוף השיעור.</div>
  <p><strong>ב. קופסת האוצרות:</strong> חפצים סמליים (זרע, פלסטר, מפתח, מצפן, פקעת חוט, נר). כל אחד/ת בוחר/ת חפץ שמזכיר משהו שעוזר לו/ה. מתאים במיוחד לכיתה ו'.</p>
  <p><strong>ג. מצלמת הרגע הטוב:</strong> תמונה או ציור של רגע קטן וטוב מהשבוע בפאדלט, בלי פנים. חלופה לא דיגיטלית: ציור על פתק.</p>
  <h3>ההסכמות שלנו (5')</h3><p>הכיתה מנסחת 3-4 הסכמות. המנחה מוודא/ת: הקשבה, כבוד, מה שנאמר כאן נשאר כאן, מדברים על עצמנו.</p>
  <h3>דגלוני השמחה (15')</h3><p>3 דברים קטנים שעושים לי טוב, ועוד דבר אחד. דגלון פיזי או פוסט אנונימי ב"קיר השמחה" בפאדלט (פיקוח מופעל). שאלות: איזה צבע יש לשמחה שלך? עם מי היית? מה שומר עליה?</p>
  <h3>ציר השמחה (8')</h3><p>חבר/ה שלח/ה לי הודעה מצחיקה · ירד גשם בדיוק בהפסקה · יוצאים לפעילות כיתתית מחוץ לכיתה · ארוחת ערב משפחתית ביחד. המסר: אותו אירוע נחווה אחרת, ולפרשנות שלנו יש השפעה.</p>
  <h3>שיחה וקושרים קשר ראשון (5')</h3><p><strong>מסר מרכזי:</strong> יש מקום גם לשמחה וגם לעצב. כשאני שם/ה לב לרגעים הטובים הקטנים, הם נותנים לי כוח. כל תלמיד/ה קושר/ת חרוז צהוב חרדל. מה לקחתי היום? מילה אחת לעצמי.</p>
  <div class="gl"><strong>יסודי:</strong> פתיח ב', ציר עם פרצופים, פחות דיון.</div>

  <h2>מפגש 2 · הרשת שמחזיקה אותי</h2>
  <p><strong>הקשר:</strong> הקשר · <strong>החרוז:</strong> בורדו · <strong>מטרות:</strong> מודעות לאנשים שאני משתף/ת; הבנה שיש מצבים שמחייבים מבוגר ולפעמים איש מקצוע.</p>
  <p><strong>פתיח "דמות עבורי" (5'):</strong> "חשבו על אדם אחד שהוא שם בשבילכם. מה יש בו?" תכונה אחת במנטימטר, בלי שם.</p>
  <p><strong>הרשת שלי (20'):</strong> רשת הביטחון של הלוליינים. במרכז אני, וסביבי: משפחה, חברים, מבוגרים בבית הספר, אנשי מקצוע, אחרים. המנחה מקריא/ה "רגעים", והתלמידים מותחים קווים. <strong>הרשת נשארת אצל התלמיד/ה.</strong></p>
  <p><strong>רגעים:</strong> קיבלתי תעודת הצטיינות; אחותי מתחתנת; עברנו דירה; רבתי עם החבר/ה הכי טוב/ה; מרגיש/ה שאין לי חברים אמיתיים; סבתא חלתה; נכשלתי במבחן חשוב; התקבלתי לנבחרת או לחוג; מישהו פגע בי ברשת. במגזר הכללי בלבד, כאופציה: "התאהבתי", "הצעתי חברות".</p>
  <div class="gl">לא לכלול אירוע שמהדהד את אירוע החשיפה.</div>
  <p><strong>מה הרשת מלמדת אותי (12'):</strong> איפה הרשת צפופה ואיפה דלילה? מה עוזר ומה מעכב? את מי הייתי רוצה להוסיף?</p>
  <p><strong>מסר מרכזי (3'):</strong> לפעמים פנייה לא מצליחה בפעם הראשונה; יש מצבים שצריך איש מקצוע. <strong>קושרים קשר שני:</strong> "הקשר", חרוז בורדו.</p>
  <div class="gl"><strong>יסודי:</strong> 6-8 רגעים פשוטים, רשת עם 3 טבעות.</div>

  <h2>מפגש 3 · הכוחות שכבר יש בי</h2>
  <p><strong>הקשר:</strong> הכוח · <strong>החרוז:</strong> ירוק זית · <strong>מטרות:</strong> זיהוי חוזקות; הבנה שחלק מהכוחות כבר בנו; לימוד מהחברים.</p>
  <p><strong>המסע לארץ עוץ (8'):</strong> תקציר במילים של המנחה, בלי קטעי סרט. "איזה כוח הם גילו שכבר היה בהם?"</p>
  <p><strong>כף היד שלי (12'):</strong> בכל אצבע כוח אחד שלי, ובאמצע: מי או מה נותן לי כוח.</p>
  <p><strong>מראה מחמיאה (12'):</strong> כל תלמיד/ה כותב/ת כוח שהוא/היא רואה בשני חברים. המנחה מסנן/ת לפני הצגה.</p>
  <p><strong>מה שומר עליי (8'):</strong> רשימה כיתתית של "דברים שעוזרים לנו בימים קשים". המנחה משלים/ה מה שחסר.</p>
  <p><strong>מסר מרכזי:</strong> הכוחות כבר בתוכנו, ואפשר ללמוד מהכוחות של החברים. <strong>קושרים קשר שלישי:</strong> "הכוח", חרוז ירוק זית.</p>
  <div class="gl"><strong>יסודי:</strong> כף יד מאוירת וצביעה.</div>

  <h2>מפגש 4 · הפצע והדרך לרפא</h2>
  <p><strong>הקשר:</strong> הריפוי · <strong>החרוז:</strong> ורוד עתיק · <strong>מטרות:</strong> לגיטימציה לכאב; היכרות עם חשיבה "שחור-לבן" בזמן לחץ ותרגול ראיית אפשרויות; למי פונים; לא להישאר לבד.</p>
  <div class="gl"><strong>הנחיה למנחה:</strong> לא פותחים את נושא האובדנות. אם תלמיד/ה מעלה אותו, עונים בקצרה וברוגע לפי נספח 4 (מקשיבים, לא שופטים, מראים שיש אלטרנטיבות, מפנים לעזרה), מחזירים בעדינות לפנייה לעזרה ולכוחות, ואחרי השיעור פועלים לפי נוהל 6.1.</div>
  <p><strong>שקף שער:</strong> "גם עץ נפצע. ומהמקום שבו נפצע, לפעמים דווקא צומחים עלים חדשים."</p>
  <p><strong>קריאת השיר "פצע" מאת עודד מבורך (7'):</strong> מילות השיר לא מוטמעות. קישור לקריאה: https://canva.link/e4v7t5h7p03s9h7</p>
  <div class="gl">בשיר יש דימויים חזקים. מקריאים בקול רגוע, לא נעצרים עליהם, ומפנים את הדיון לשאלות של תגובה, קרבה ועזרה.</div>
  <p><strong>שאלות לדיון:</strong> איזה סוגי פצעים פגשנו? (בלי פירוט אישי) · כשאני פוגש/ת פצע של מישהו אחר, מה אני עושה, ומה עוזר לי להתקרב? · מה יכול להיות החוט שמחבר אותי למי שכואב לו? · מי האדם שאומר לי "זה יעבור"? (תפקידים, לא שמות)</p>
  <p><strong>ערכת עזרה ראשונה (10'):</strong> פצע בגוף: מה מנקה, מה מגן, מתי צריך רופא. פצע בלב: מה עוזר לבד, מתי חבר, מתי מבוגר, מתי איש מקצוע.</p>
  <p><strong>סימן שאלה, סימן קריאה (12'):</strong> בזוגות מחליפים את סימן הקריאה בסימן שאלה ומחפשים שתי אפשרויות.</p>
  <p><strong>מי יכול לעזור לי כשיש לי פצע? (10'):</strong> מפת דמויות ותפקידים בבית הספר ומחוצה לו.</p>
  <p><strong>סגירה (6'):</strong> "אף פעם לא להישאר לבד, לא עם הפצע שלי ולא עם הפצע של החבר שלי." <strong>קושרים קשר רביעי:</strong> "הריפוי", חרוז ורוד עתיק.</p>
  <div class="gl"><strong>יסודי:</strong> לא קוראים את השיר במלואו; מתחילים מהשאלה שפותחת אותו ומהשאלה שחותמת אותו, ועוברים לערכת העזרה. בלי פעילות סימן שאלה.</div>

  <h2>מפגש 5 · חבר בשביל חבר</h2>
  <p><strong>הקשר:</strong> העזרה · <strong>החרוז:</strong> זהב · <strong>מטרות:</strong> להבחין בין שיתוף מבוגר ל"הלשנה"; לתרגל ניסוח פנייה; להכיר גורמי סיוע; לסגור את החוט.</p>
  <p><strong>סוד או דאגה? (6'):</strong> חבר מתכנן מסיבת הפתעה · חבר סיפר שמציקים לו ברשת וביקש שלא אגלה · חברה אומרת שאין לה כוח לכלום כבר שבועיים · חברה קנתה מתנה לאמא שלה · חבר נכשל במבחן ומתבייש לספר בבית.</p>
  <p><strong>הסיפור של נועם (12'):</strong> נועם שם לב שהחבר שלו נהיה שקט, מוותר על אימונים, וכתב לו "עזוב, זה לא משנה" (בכיתת בנות: נועם וחברתה, "עזבי, זה לא משנה"). מה ראיתי, מה אני מרגיש/ה, מה יכול לעזור? המסר: לשתף מבוגר כשחבר במצוקה זו לא "הלשנה", זו אכפתיות וחברות אמיתית.</p>
  <p><strong>גשר המילים (8'):</strong> פתיחה, מה ראיתי, מה מדאיג אותי, מה אני מבקש/ת.</p>
  <p><strong>החוט המשולש (15'):</strong> חרוז זהב "העזרה". צמה משלושה חוטים: החוט שלי, חוט הרשת, חוט הזהב. "החוט המשולש לא במהרה יינתק" (קהלת ד, יב). תגית "החוט שלי" עם גורמי הסיוע.</p>
  <p><strong>חוט מחבר (רשות):</strong> חוט זהב קצר במעטפה, לתת למישהו קרוב, כמו "אני כאן בשבילך".</p>
  <p><strong>סגירה "לקום מחר בבוקר" (3-5'):</strong> מילים ולחן: נעמי שמר. להאזנה: https://www.youtube.com/watch?v=6MoC6RETWhQ · קליפ "תקווה אחרי 7.10" (רשות, בשיקול דעת): https://www.youtube.com/watch?v=-P0Gnvk5Kmk</p>
  <div class="gl"><strong>לפני שבוחרים קישור:</strong> הקליפ כולל תמונות רגישות מ-7.10. חובה לצפות בו לפני השיעור. מומלץ להשתמש בביצוע השיר בהתערבות 6.2, כשיש בכיתה תלמידים שחוו אובדן, פגיעה או פינוי, כשאין זמן לשיחה אחרי הצפייה, או בכיתה ו'.</div>

const $main = document.getElementById('main'), $tabs = document.getElementById('tabs'), $modal = document.getElementById('modal');
const $g = document.getElementById('tgGuide'), $b = document.getElementById('tgBasic');
function render(scrollTop){
  $tabs.innerHTML = TABS.map(([id,label,b])=>`<li><a href="#${id}" ${S.tab===id?'aria-current="page"':''}>${b?`<img src="${IMG(b)}" alt="">`:''}${label}</a></li>`).join('');

  else if (inLesson) html = viewLesson(+S.tab.slice(6));
  else if (S.tab==='strengths') html = viewStrengths();
  else if (S.tab==='print') html = viewPrint();

  $main.innerHTML = html;
  $modal.innerHTML = modalHtml();
  const cur = $tabs.querySelector('[aria-current="page"]');

function renderSlideOnly(){ if (/^lesson\d$/.test(S.tab)) { const y = window.scrollY; render(false); window.scrollTo(0,y); } }
function fromHash(){

document.addEventListener('click', e => {

  const lm = /^lesson(\d)$/.exec(S.tab); if (!lm) return;
  const n = +lm[1], st = L[n], ids = lessonIds(n);
  if (t.dataset.nav){ st.k = Math.max(0, Math.min(ids.length-1, Math.min(st.k, ids.length-1) + (+t.dataset.nav))); renderSlideOnly(); return; }
  if (t.dataset.go){ st.k = +t.dataset.go; renderSlideOnly(); return; }
  const a = t.dataset.act, g = t.dataset.arg; if (!a) return;
  switch(a){
    case 'tie': st.tied=true; S.done[n-1]=true; persist(); break;
    case 'opener': st.opener=g; st.q=false; st.k=ids.indexOf('opener'); break;
    case 'q': st.q=true; break;

    case 'flagN': st.flagN++; break;
    case 'scaleMsg': st.scaleMsg=true; break;
    case 'm': st.m=Math.max(0,st.m+(+g)); break;
    case 'lq': st.lq++; break;
    case 'pick': st.picked[g]=!st.picked[g]; break;
    case 'pi': st.pi++; break;
    case 'dq': st.dq=Math.max(0,st.dq+(+g)); break;
    case 'flip': st.flipped[+g]=!st.flipped[+g]; break;
    case 'sc': st.sc=Math.max(0,st.sc+(+g)); break;
    case 'vote': st.vote[Math.min(st.sc, S.basic?1:4)]=g; break;
    case 'ni': st.ni++; break;
    case 'noamMsg': st.noamMsg=true; break;
    case 'plank': st.planks[g]=!st.planks[g]; break;
    case 'bv': st.votes[+g]++; break;
    case 'rc': st.rc[+g]=!st.rc[+g]; break;
  }
  renderSlideOnly();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.check!==undefined) return;
  const lm = /^lesson(\d)$/.exec(S.tab); if (!lm) return;
  const st = L[+lm[1]];
  if (t.dataset.input) st[t.dataset.input]=t.value;
  if (t.dataset.range!==undefined) st.scale[+t.dataset.range]=+t.value;
});
document.addEventListener('change', e => { const t=e.target; if (t.dataset.check!==undefined){ S.checks[+t.dataset.check]=t.checked; persist(); render(false); } });
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.dataset.form==='keep'){ const st=L[3]; const v=(st.draft||'').trim(); if(v){ st.keeps.push(v); st.draft=''; renderSlideOnly(); const f=document.getElementById('l3draft'); if(f) f.focus(); } }
});
document.addEventListener('keydown', e => {
  if (e.key==='Escape' && S.modal){ S.modal=null; $modal.innerHTML=''; return; }
  const lm = /^lesson(\d)$/.exec(S.tab); if (!lm || S.modal) return;
  if (/INPUT|TEXTAREA|SELECT/.test((e.target.tagName||''))) return;
  const n=+lm[1], st=L[n], ids=lessonIds(n);
  if (e.key==='ArrowLeft' || e.key==='PageDown'){ st.k=Math.min(ids.length-1, Math.min(st.k,ids.length-1)+1); renderSlideOnly(); e.preventDefault(); }
  if (e.key==='ArrowRight' || e.key==='PageUp'){ st.k=Math.max(0, Math.min(st.k,ids.length-1)-1); renderSlideOnly(); e.preventDefault(); }
});
fromHash();
})();
